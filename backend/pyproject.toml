[project]
name = "mallot-invest-agent"
version = "0.1.0"
description = "Multi-agent investment desk: debate, gate, trader — with LLM routing and call tracing"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "claude-agent-sdk>=0.2.164",
    "fastapi>=0.142.2",
    "mlx-lm>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
langsmith = [
    "langsmith>=0.14.17",
]
langgraph = [
    "langgraph>=1.2.20",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
